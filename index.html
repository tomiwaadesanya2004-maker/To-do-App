<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Todo List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--muted:#6b7a90;--line:#d5dde8;--accent:#2f5bea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#182236;--ink:#e8edf6;--muted:#8d9bb2;--line:#2a3750;--accent:#6c8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:480px}
h1{font-size:2rem;margin:8px 0 4px;letter-spacing:-.02em}
#count{color:var(--muted);margin:0 0 20px}
form{display:flex;gap:8px}
input[type=text]{flex:1;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=text]:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{font:inherit;font-weight:700;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.filters{display:flex;gap:6px;margin:16px 0}
.filters button{font:inherit;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:none;color:var(--muted);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input{width:20px;height:20px;accent-color:var(--accent)}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--muted)}
li .del{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer}
.empty{padding:20px;color:var(--muted);text-align:center}
#clear{margin-top:14px;font:inherit;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer}
form{flex-wrap:wrap}
.when{flex-basis:100%;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.when input{font:inherit;flex:1;min-width:0;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
li .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
li .body span{flex:none}
.chip{font-size:.8rem;color:var(--muted)}
.chip.due{color:#d9480f;font-weight:700}
@media (prefers-color-scheme:dark){.chip.due{color:#ff9d5c}}
li .bell{border:0;background:none;font-size:1.05rem;cursor:pointer;opacity:.7}
li .bell:hover{opacity:1}
li .pick{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
#toasts{position:fixed;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;width:100%;max-width:448px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px}
.toast b{flex:1;word-break:break-word}
.toast button{font:inherit;font-size:.85rem;border:1.5px solid currentColor;background:none;color:inherit;border-radius:8px;padding:4px 10px;cursor:pointer}
li{flex-wrap:wrap}
textarea{font:inherit;width:100%;resize:vertical;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea:focus{outline:2px solid var(--accent);outline-offset:2px}
#note{flex-basis:100%}
li textarea.notebox{flex-basis:100%;margin-left:32px;width:calc(100% - 32px)}
.notepv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .notebtn{border:0;background:none;font-size:1.05rem;cursor:pointer;opacity:.45}
li .notebtn.has,li .notebtn:hover{opacity:1}
</style>
</head>
<body>
<main>
  <h1>Todo list</h1>
  <p id="count" aria-live="polite"></p>
  <form id="form">
    <input type="text" id="text" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
    <button class="add" type="submit">Add task</button>
    <label class="when">Remind me <input type="datetime-local" id="when" aria-label="Reminder time"></label>
    <textarea id="note" rows="2" placeholder="Add a note (optional)" aria-label="Note"></textarea>
  </form>
  <div class="filters" id="filters">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="active" aria-pressed="false">Active</button>
    <button data-f="done" aria-pressed="false">Done</button>
  </div>
  <ul id="list"></ul>
  <div id="toasts" aria-live="assertive"></div>
  <button id="clear">Clear completed</button>
</main>
<script>
let todos = [], filter = "all";
const openNotes = new WeakSet();
let focusTask = null;
try { todos = JSON.parse(localStorage.getItem("todos") || "[]"); } catch (e) {}
const $ = id => document.getElementById(id);
function save(){ try { localStorage.setItem("todos", JSON.stringify(todos)); } catch (e) {} }
function render(){
  const shown = todos.filter(t => filter === "all" || (filter === "done") === t.done);
  const left = todos.filter(t => !t.done).length;
  $("count").textContent = todos.length ? left + " of " + todos.length + " tasks left" : "No tasks yet.";
  $("list").innerHTML = "";
  if (!shown.length) { $("list").innerHTML = '<li class="empty">Nothing here. Add a task above.</li>'; }
  shown.forEach(t => {
    const li = document.createElement("li");
    if (t.done) li.className = "done";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done; cb.setAttribute("aria-label", "Mark done");
    cb.onchange = () => { t.done = cb.checked; save(); render(); };
    const body = document.createElement("div"); body.className = "body";
    const sp = document.createElement("span"); sp.textContent = t.text;
    body.appendChild(sp);
    if (t.remind) {
      const chip = document.createElement("span");
      const late = !t.done && t.remind <= Date.now();
      chip.className = "chip" + (late ? " due" : "");
      chip.textContent = "🔔 " + fmt(t.remind) + (late ? " · due" : "");
      body.appendChild(chip);
    }
    if (t.note && !openNotes.has(t)) {
      const pv = document.createElement("span");
      pv.className = "chip notepv";
      pv.textContent = "📝 " + t.note.split("\n")[0];
      body.appendChild(pv);
    }
    const nb = document.createElement("button");
    nb.className = "notebtn" + (t.note ? " has" : ""); nb.textContent = "📝";
    nb.setAttribute("aria-label", openNotes.has(t) ? "Close note" : "Open note");
    nb.setAttribute("aria-expanded", openNotes.has(t));
    nb.onclick = () => {
      if (openNotes.has(t)) openNotes.delete(t); else { openNotes.add(t); focusTask = t; }
      render();
    };
    const bell = document.createElement("button");
    bell.className = "bell"; bell.textContent = t.remind ? "✕" : "🔔";
    bell.setAttribute("aria-label", t.remind ? "Remove reminder" : "Set reminder");
    const pick = document.createElement("input");
    pick.type = "datetime-local"; pick.className = "pick"; pick.min = nowLocal(); pick.tabIndex = -1;
    pick.onchange = () => { if (pick.value) { setRemind(t, new Date(pick.value).getTime()); save(); render(); } };
    bell.onclick = () => {
      if (t.remind) { t.remind = null; t.fired = false; save(); render(); return; }
      askPermission();
      try { pick.showPicker(); } catch (e) { pick.style.cssText = "position:static;opacity:1;pointer-events:auto;width:auto"; pick.focus(); }
    };
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Delete task");
    del.onclick = () => { todos = todos.filter(x => x !== t); save(); render(); };
    li.append(cb, body, pick, nb, bell, del);
    let ta = null;
    if (openNotes.has(t)) {
      ta = document.createElement("textarea");
      ta.className = "notebox"; ta.rows = 3; ta.value = t.note || "";
      ta.placeholder = "Write a note"; ta.setAttribute("aria-label", "Note for this task");
      ta.oninput = () => { t.note = ta.value; save(); };
      li.appendChild(ta);
    }
    $("list").appendChild(li);
    if (ta && focusTask === t) { ta.focus(); focusTask = null; }
  });
}
$("form").onsubmit = e => {
  e.preventDefault();
  const v = $("text").value.trim();
  if (!v) return;
  const task = { text: v, done: false, remind: null, fired: false, note: $("note").value.trim() };
  if ($("when").value) { setRemind(task, new Date($("when").value).getTime()); askPermission(); }
  todos.unshift(task);
  $("text").value = ""; $("when").value = ""; $("note").value = "";
  save(); render();
};
$("filters").onclick = e => {
  const f = e.target.dataset.f; if (!f) return;
  filter = f;
  document.querySelectorAll("#filters button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === f));
  render();
};
$("clear").onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };

// ---- Reminders ----
function nowLocal(){ return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
function fmt(ts){ return new Date(ts).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
function setRemind(t, ts){ t.remind = ts; t.fired = false; }
function askPermission(){ try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) {} }
function beep(){
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .15;
    o.start(); o.stop(c.currentTime + .25);
  } catch (e) {}
}
function alertFor(t){
  beep();
  try { if ("Notification" in window && Notification.permission === "granted") new Notification("Reminder", { body: t.text }); } catch (e) {}
  const el = document.createElement("div"); el.className = "toast";
  const b = document.createElement("b"); b.textContent = "🔔 " + t.text;
  const snooze = document.createElement("button"); snooze.textContent = "Snooze 10 min";
  const ok = document.createElement("button"); ok.textContent = "Dismiss";
  snooze.onclick = () => { setRemind(t, Date.now() + 600000); save(); el.remove(); render(); };
  ok.onclick = () => el.remove();
  el.append(b, snooze, ok);
  $("toasts").appendChild(el);
}
function tick(){
  const now = Date.now(); let changed = false;
  todos.forEach(t => {
    if (t.remind && !t.fired && !t.done && t.remind <= now) { t.fired = true; changed = true; alertFor(t); }
  });
  if (changed) save();
  if (!(document.activeElement && document.activeElement.classList.contains("notebox"))) render();
}
$("when").min = nowLocal();
setInterval(tick, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
tick();
</script>
</body>
</html>
