<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Todo List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--muted:#6b7a90;--line:#d5dde8;--accent:#2f5bea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#182236;--ink:#e8edf6;--muted:#8d9bb2;--line:#2a3750;--accent:#6c8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:480px}
h1{font-size:2rem;margin:8px 0 4px;letter-spacing:-.02em}
#count{color:var(--muted);margin:0 0 20px}
form{display:flex;gap:8px}
input[type=text]{flex:1;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=text]:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{font:inherit;font-weight:700;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.filters{display:flex;gap:6px;margin:16px 0}
.filters button{font:inherit;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:none;color:var(--muted);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input{width:20px;height:20px;accent-color:var(--accent)}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--muted)}
li .del{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer}
.empty{padding:20px;color:var(--muted);text-align:center}
#clear{margin-top:14px;font:inherit;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Todo list</h1>
  <p id="count" aria-live="polite"></p>
  <form id="form">
    <input type="text" id="text" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
    <button class="add" type="submit">Add task</button>
  </form>
  <div class="filters" id="filters">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="active" aria-pressed="false">Active</button>
    <button data-f="done" aria-pressed="false">Done</button>
  </div>
  <ul id="list"></ul>
  <button id="clear">Clear completed</button>
</main>
<script>
let todos = [], filter = "all";
try { todos = JSON.parse(localStorage.getItem("todos") || "[]"); } catch (e) {}
const $ = id => document.getElementById(id);
function save(){ try { localStorage.setItem("todos", JSON.stringify(todos)); } catch (e) {} }
function render(){
  const shown = todos.filter(t => filter === "all" || (filter === "done") === t.done);
  const left = todos.filter(t => !t.done).length;
  $("count").textContent = todos.length ? left + " of " + todos.length + " tasks left" : "No tasks yet.";
  $("list").innerHTML = "";
  if (!shown.length) { $("list").innerHTML = '<li class="empty">Nothing here. Add a task above.</li>'; }
  shown.forEach(t => {
    const li = document.createElement("li");
    if (t.done) li.className = "done";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done; cb.setAttribute("aria-label", "Mark done");
    cb.onchange = () => { t.done = cb.checked; save(); render(); };
    const sp = document.createElement("span"); sp.textContent = t.text;
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Delete task");
    del.onclick = () => { todos = todos.filter(x => x !== t); save(); render(); };
    li.append(cb, sp, del);
    $("list").appendChild(li);
  });
}
$("form").onsubmit = e => {
  e.preventDefault();
  const v = $("text").value.trim();
  if (!v) return;
  todos.unshift({ text: v, done: false });
  $("text").value = "";
  save(); render();
};
$("filters").onclick = e => {
  const f = e.target.dataset.f; if (!f) return;
  filter = f;
  document.querySelectorAll("#filters button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === f));
  render();
};
$("clear").onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };
render();
</script>
</body>
</html>
